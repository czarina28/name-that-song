<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f2e9;background:#141414}*{box-sizing:border-box}body{margin:0;min-height:100dvh}main{max-width:520px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;color:#d6c8ad;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2.5rem,10vw,4rem);line-height:.95;letter-spacing:-.05em;margin:35px 0 15px}p{line-height:1.5}.muted{color:#bcb4a8}.tag{color:#ffbb65}.progress{height:6px;background:#39332d;border-radius:9px;overflow:hidden;margin:25px 0}.progress>div{height:100%;background:#ffb45b;transition:width .2s}.clue{background:#25211f;border:1px solid #4c4034;border-radius:20px;padding:28px 24px;min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.5rem;font-weight:700;line-height:1.3}.answers{display:grid;gap:12px;margin-top:22px}button{font:inherit;cursor:pointer;border-radius:12px;padding:17px 16px;border:1px solid #675746;background:#302a26;color:#fff;text-align:left;min-height:56px}button:focus-visible{outline:3px solid #ffba65;outline-offset:3px}button:disabled{cursor:default}button.correct{background:#164c3b;border-color:#53c69a}button.wrong{background:#602d32;border-color:#e48a8d}.primary{background:#ffb45b;color:#21170c;font-weight:800;text-align:center;border:0;width:100%;margin-top:20px}.feedback{min-height:56px;margin-top:18px}.score{font-size:3rem;font-weight:900;margin:20px 0}footer{margin-top:32px;color:#9d9388;font-size:.75rem}.hidden{display:none}
</style></head><body><main><header><strong>NAME THAT SONG</strong><span id="round">ROUND 1 / 10</span></header>
<section id="intro"><h1>Know the story.<br><span class="tag">Name the song.</span></h1><p class="muted">Ten famous songs. Four choices each. No quoted lyrics, no trick questions, and no game over.</p><button class="primary" id="start">PLAY A ROUND →</button></section>
<section id="game" class="hidden" aria-live="polite"><div class="progress"><div id="bar"></div></div><p class="muted" id="counter"></p><p id="streak" style="color:#ffbb65;font-weight:800" aria-live="polite"></p><div class="clue" id="clue"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hidden" id="next">NEXT SONG →</button></section>

<script>
const questions=[{"id":1,"clue":"An astronaut loses contact with Earth while floating in space.","answer":"Space Oddity","options":["Space Oddity","Rocket Man","Starman","Walking on the Moon"],"artist":"David Bowie","difficulty":"easy"},{"id":2,"clue":"A visitor finds a glamorous hotel that feels impossible to escape.","answer":"Hotel California","options":["Hotel California","Heartbreak Hotel","California Dreamin'","Motel Blues"],"artist":"Eagles","difficulty":"easy"},{"id":3,"clue":"A singer denies being the father of a woman's child.","answer":"Billie Jean","options":["Billie Jean","Maneater","Roxanne","Jolene"],"artist":"Michael Jackson","difficulty":"easy"},{"id":4,"clue":"A teenager leaves home while her parents struggle to understand why.","answer":"She's Leaving Home","options":["She's Leaving Home","Our House","Fast Car","Runaway"],"artist":"The Beatles","difficulty":"easy"},{"id":5,"clue":"Someone begs a woman not to take her partner away.","answer":"Jolene","options":["Jolene","Roxanne","Layla","Maggie May"],"artist":"Dolly Parton","difficulty":"easy"},{"id":6,"clue":"A singer imagines a world without countries or possessions.","answer":"Imagine","options":["Imagine","What a Wonderful World","All You Need Is Love","Peace Train"],"artist":"John Lennon","difficulty":"easy"},{"id":7,"clue":"A man describes his life on the road as a traveling musician.","answer":"Turn the Page","options":["Turn the Page","Life Is a Highway","Born to Run","The Passenger"],"artist":"Bob Seger","difficulty":"easy"},{"id":8,"clue":"A singer wonders whether life is real after a terrible act.","answer":"Bohemian Rhapsody","options":["Bohemian Rhapsody","Killer Queen","The Show Must Go On","Dream On"],"artist":"Queen","difficulty":"easy"},{"id":9,"clue":"A narrator describes a vision of crowds who cannot communicate meaningfully.","answer":"The Sound of Silence","options":["The Sound of Silence","Piano Man","The Boxer","People Are Strange"],"artist":"Simon & Garfunkel","difficulty": Dark","Jack & Diane","Brown Eyed Girl"],"artist":"Bryan Adams","difficulty":"medium"},{"id":20,"clue":"A person promises to support someone through darkness and trouble.","answer":"Stand by Me","options":["Stand by Me","Stay","Hold Me Now","Don't Leave Me This Way"],"artist":"Ben E. King","difficulty":"medium"},{"id":21,"clue":"A person asks someone to stop worrying and find comfort after a loss.","answer":"Hey Jude","options":["Hey Jude","Let It Be","Yesterday","Help!"],"artist":"The Beatles","difficulty":"easy"},{"id":22,"clue":"A singer remembers a girl with brown eyes and carefree days together.","answer":"Brown Eyed Girl","options":["Brown Eyed Girl","Sweet Caroline","Maggie May","American Girl"],"artist":"Van Morrison","difficulty":"easy"},{"id":23,"clue":"Two lovers playfully ask each other not to cause heartbreak.","answer":"Don't Go Breaking My Heart","options":["Don't Go Breaking My Heart","Stayin' Alive","Every Breath You Take","Dancing in the Dark"],"artist":"Elton John & Kiki Dee","difficulty":"easy"},{"id":24,"clue":"A singer celebrates a city where they hope to succeed.","answer":"New York, New York","options":["New York, New York","Viva Las Vegas","California Dreamin'","Philadelphia Freedom"],"artist":"Frank Sinatra","difficulty":"easy"},{"id":25,"clue":"A narrator admits they cannot stop watching someone they used to love.","answer":"Every Breath You Take","options":["Every Breath You Take","With or Without You","Missing You","Don't You Want Me"],"artist":"The Police","difficulty":"easy"},{"id":26,"clue":"A singer joyfully leads a crowd in singing about a woman named Caroline.","answer":"Sweet Caroline","options":["Sweet Caroline","Brown Eyed Girl","Jolene","My Girl"],"artist":"Neil Diamond","difficulty":"easy"},{"id":28,"clue":"A singer promises that everything will eventually work out during troubled times.","answer":"Three Little Birds","options":["Three Little Birds","Imagine","Redemption Song","One Love"],"artist":"Bob Marley & The Wailers","difficulty":"easy"},{"id":29,"clue":"A singer feels especially happy and in love on Fridays.","answer":"Friday I'm in Love","options":["Friday I'm in Love","Dancing Queen","Last Friday Night","Saturday Night's Alright for Fighting"],"artist":"The Cure","difficulty":"easy"},{"id":30,"clue":"A person wants to break free from expectations and live independently.","answer":"I Want to Break Free","options":["I Want to Break Free","Freedom! '90","Break Free","Don't Stop Me Now"],"artist":"Queen","difficulty":"easy"},{"id":31,"clue":"A singer wonders why a romantic partner suddenly stopped loving them.","answer":"Don't You Want Me","options":["Don't You Want Me","Take On Me","Tainted Love","True"],"artist":"The Human League","difficulty":"easy"},{"id":32,"clue":"A singer enthusiastically celebrates cycling instead of driving.","answer":"Bicycle Race","options":["Bicycle Race","Born to Be Wild","Drive My Car","Ride Like the Wind"],"artist":"Queen","difficulty":"easy"},{"id":35,"clue":"Two teenagers recall a brief holiday romance at the beach.","answer":"Summer Nights","options":["Summer Nights","Summer of '69","The Boys of Summer","California Girls"],"artist":"John Travolta & Olivia Newton-John","difficulty":"easy"},{"id":36,"clue":"A singer tells a former partner they are better off alone.","answer":"Since U Been Gone","options":["Since U Been Gone","I Will Survive","You Oughta Know","Go Your Own Way"],"artist":"Kelly Clarkson","difficulty":"easy"},{"id":37,"clue":"A person describes the thrill of driving down a road with nowhere particular to go.","answer":"Life Is a Highway","options":["Life Is a Highway","Born to Run","Drive","Fast Car"],"artist":"Tom Cochrane","difficulty":"easy"},{"id":39,"clue":"A singer calls on people across a city to dance in public.","answer":"Dancing in the Street","options":["Dancing in the Street","We Will Rock You","Celebration","Twist and Shout"],"artist":"Martha and the Vandellas","difficulty":"easy"},{"id":40,"clue":"A traveler searches for spiritual fulfillment but hasn't found it yet.","answer":"I Still Haven't Found What I'm Looking For","options":["I Still Haven't Found What I'm Looking For","At Last","I Want to Know What Love Is","Can't Help Falling in Love"],"artist":"Etta James","difficulty":"easy"},{"id":41,"clue":"A singer asks for help because they are feeling less confident than before.","answer":"Help!","options":["Help!","Don't Let Me Down","Fix You","Hold On"],"artist":"The Beatles","difficulty":"easy"},{"id":42,"clue":"A nostalgic singer remembers the day the music died.","answer":"American Pie","options":["American Pie","Dancing in the Dark","Jack & Diane","Wonderful Tonight"],"artist":"Don McLean","difficulty":"medium"},{"id":43,"clue":"A stranger on a train shares advice about knowing when to take risks.","answer":"The Gambler","options":["The Gambler","Midnight Train to Georgia","Folsom Prison Blues","City of New Orleans"],"artist":"Kenny Rogers","difficulty":"easy"},{"id":45,"clue":"Two performers trade phone calls while one is out dancing in a club.","answer":"Telephone","options":["Telephone","Call Me","Hanging on the Telephone","Hello"],"artist":"Lady Gaga","difficulty":"medium"},{"id":46,"clue":"A singer treasures a picture of someone they love while separated from them.","answer":"Photograph","options":["Photograph","Pictures of You","Every Picture Tells a Story","Kodachrome"],"artist":"Ed Sheeran","difficulty":"medium"},{"id":47,"clue":"A singer struggles with jealousy when their partner talks to another person.","answer":"Mr. Brightside","options":["Mr. Brightside","Somebody Told Me","Jealous Guy","Every Breath You Take"],"artist":"The Killers","difficulty":"easy"},{"id":48,"clue":"A singer asks someone to join them in a joyful celebration.","answer":"Celebration","options":["Celebration","Let's Dance","Get Lucky","Dancing Queen"],"artist":"Kool & The Gang","difficulty":"easy"},{"id":49,"clue":"A young couple travels across America by bus, searching for meaning.","answer":"America","options":["America","Born to Run","American Girl","Take It Easy"],"artist":"Simon & Garfunkel","difficulty":"medium"},{"id":51,"clue":"A singer feels trapped by the memory of a relationship that ended.","answer":"Somebody That I Used to Know","options":["Somebody That I Used to Know","Every Breath You Take","Tainted Love","Take On Me"],"artist":"Gotye feat. Kimbra","difficulty":"easy"},{"id":52,"clue":"A narrator sings about an outlaw imprisoned after committing murder.","answer":"Folsom Prison Blues","options":["Folsom Prison Blues","The Gambler","Hurricane","Bad Moon Rising"],"artist":"Johnny Cash","difficulty":"easy"},{"id":53,"clue":"A singer dreams of leaving the cold for a warmer place.","answer":"California Dreamin'","options":["California Dreamin'","Hotel California","California Girls","Walking on Sunshine"],"artist":"The Mamas & the Papas","difficulty":"easy"},{"id":54,"clue":"A singer notices trees, skies, friends, and babies and marvels at everyday life.","answer":"What a Wonderful World","options":["What a Wonderful World","Lovely Day","Here Comes the Sun","Beautiful Day"],"artist":"Louis Armstrong","difficulty":"easy"},{"id":55,"clue":"A singer describes meeting someone at a club and falling in love.","answer":"Shape of You","options":["Shape of You","Dancing Queen","Get Lucky","Just Dance"],"artist":"Ed Sheeran","difficulty":"easy"},{"id":57,"clue":"A man meets a captivating person named Lola in a London club.","answer":"Lola","options":["Lola","Roxanne","Maggie May","Layla"],"artist":"The Kinks","difficulty":"medium"},{"id":58,"clue":"A singer asks the sun to come out after a long, difficult winter.","answer":"Here Comes the Sun","options":["Here Comes the Sun","Walking on Sunshine","Mr. Blue Sky","Good Day Sunshine"],"artist":"The Beatles","difficulty":"easy"},{"id":60,"clue":"A singer invites everyone to dance and forget their troubles.","answer":"Let's Dance","options":["Let's Dance","Dancing in the Street","Just Dance","Footloose"],"artist":"David Bowie","difficulty":"easy"}];
let deck=[],index=0,score=0,answered=false,streak=0,bestStreak=0;
const el=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){deck=shuffle(questions.filter(q=>q.difficulty==="easy")).slice(0,8).concat(shuffle(questions.filter(q=>q.difficulty==="medium")).slice(0,2));deck=shuffle(deck);index=0;score=0;streak=0;bestStreak=0;el("intro").classList.add("hidden");el("finish").classList.add("hidden");el("game").classList.remove("hidden");render()}
function render(){answered=false;const q=deck[index];el("round").textContent="ROUND "+(index+1)+" / "+deck.length;el("counter").textContent="SONG "+(index+1)+" OF "+deck.length+" · "+score+" correct";el("streak").textContent=streak>=2?"★ "+streak+" correct in a row!":"";el("bar").style.width=((index)/deck.length*100)+"%";el("clue").textContent=q.clue;el("feedback").textContent="";el("next").classList.add("hidden");const a=el("answers");a.replaceChildren();shuffle(q.options).forEach(opt=>{const b=document.createElement("button");b.textContent=opt;b.addEventListener("click",()=>choose(opt));a.append(b)})}
function choose(opt){if(answered)return;answered=true;const q=deck[index];const correct=opt===q.answer;if(correct){score++;streak++;bestStreak=Math.max(bestStreak,streak)}else streak=0;for(const b of el("answers").children){b.disabled=true;if(b.textContent===q.answer)b.classList.add("correct");else if(b.textContent===opt)b.classList.add("wrong")}el("feedback").textContent=(correct?"✓ That's right! ":"Not quite. ")+q.answer+" — "+q.artist;el("next").classList.remove("hidden");el("next").textContent=index===deck.length-1?"SEE MY SCORE →":"NEXT SONG →"}
function next(){if(++index<deck.length)render();else{el("game").classList.add("hidden");el("finish").classList.remove("hidden");el("round").textContent="FINISHED";el("finalScore").textContent=score+" / "+deck.length;el("finalMessage").textContent=score===10?"Perfect round!":score>=8?"Brilliant! You know your music.":score>=5?"Nice work! Keep going.":"You finished the round — keep discovering!";el("stats").textContent=Math.round(score/deck.length*100)+"% correct · Best streak: "+bestStreak}}
el("start").addEventListener("click",start);el("again").addEventListener("click",start);el("next").addEventListener("click",next);
</script></body></html>
