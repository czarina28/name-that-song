<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><title>Name That Song</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f2e9;background:#141414}*{box-sizing:border-box}body{margin:0;min-height:100dvh}main{max-width:520px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;color:#d6c8ad;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2.5rem,10vw,4rem);line-height:.95;letter-spacing:-.05em;margin:35px 0 15px}p{line-height:1.5}.muted{color:#bcb4a8}.tag{color:#ffbb65}.progress{height:6px;background:#39332d;border-radius:9px;overflow:hidden;margin:25px 0}.progress>div{height:100%;background:#ffb45b;transition:width .2s}.clue{background:#25211f;border:1px solid #4c4034;border-radius:20px;padding:28px 24px;min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.5rem;font-weight:700;line-height:1.3}.answers{display:grid;gap:12px;margin-top:22px}button{font:inherit;cursor:pointer;border-radius:12px;padding:17px 16px;border:1px solid #675746;background:#302a26;color:#fff;text-align:left;min-height:56px}button:focus-visible{outline:3px solid #ffba65;outline-offset:3px}button:disabled{cursor:default}button.correct{background:#164c3b;border-color:#53c69a}button.wrong{background:#602d32;border-color:#e48a8d}.primary{background:#ffb45b;color:#21170c;font-weight:800;text-align:center;border:0;width:100%;margin-top:20px}.feedback{min-height:56px;margin-top:18px}.score{font-size:3rem;font-weight:900;margin:20px 0}footer{margin-top:32px;color:#9d9388;font-size:.75rem}.hidden{display:none}
</style></head><body><main><header><strong>NAME THAT SONG</strong><span id="round">ROUND 1 / 10</span></header>
<section id="intro"><h1>Know the story.<br><span class="tag">Name the song.</span></h1><p class="muted">Ten famous songs. Four choices each. No quoted lyrics, no trick questions, and no game over.</p><button class="primary" id="start">PLAY A ROUND →</button></section>
<section id="game" class="hidden" aria-live="polite"><div class="progress"><div id="bar"></div></div><p class="muted" id="counter"></p><div class="clue" id="clue"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hidden" id="next">NEXT SONG →</button></section>
<section id="finish" class="hidden"><h1>Round complete.</h1><div class="score" id="finalScore"></div><p id="finalMessage"></p><button class="primary" id="again">PLAY AGAIN →</button></section>
<footer>Original song descriptions, not reproduced lyrics. Prototype v0.1 · No purchases enabled.</footer></main>
<script>
const questions=[{"id":1,"clue":"An astronaut loses contact with Earth while floating in space.","answer":"Space Oddity","options":["Space Oddity","Rocket Man","Starman","Walking on the Moon"],"artist":"David Bowie","difficulty":"easy"},{"id":2,"clue":"A visitor finds a glamorous hotel that feels impossible to escape.","answer":"Hotel California","options":["Hotel California","Heartbreak Hotel","California Dreamin'","Motel Blues"],"artist":"Eagles","difficulty":"easy"},{"id":3,"clue":"A singer denies being the father of a woman's child.","answer":"Billie Jean","options":["Billie Jean","Maneater","Roxanne","Jolene"],"artist":"Michael Jackson","difficulty":"easy"},{"id":4,"clue":"A teenager leaves home while her parents struggle to understand why.","answer":"She's Leaving Home","options":["She's Leaving Home","Our House","Fast Car","Runaway"],"artist":"The Beatles","difficulty":"easy"},{"id":5,"clue":"Someone begs a woman not to take her partner away.","answer":"Jolene","options":["Jolene","Roxanne","Layla","Maggie May"],"artist":"Dolly Parton","difficulty":"easy"},{"id":6,"clue":"A singer imagines a world without countries or possessions.","answer":"Imagine","options":["Imagine","What a Wonderful World","All You Need Is Love","Peace Train"],"artist":"John Lennon","difficulty":"easy"},{"id":7,"clue":"A man describes his life on the road as a traveling musician.","answer":"Turn the Page","options":["Turn the Page","Life Is a Highway","Born to Run","The Passenger"],"artist":"Bob Seger","difficulty":"easy"},{"id":8,"clue":"A singer wonders whether life is real after a terrible act.","answer":"Bohemian Rhapsody","options":["Bohemian Rhapsody","Killer Queen","The Show Must Go On","Dream On"],"artist":"Queen","difficulty":"easy"},{"id":9,"clue":"A lonely person watches strangers while sitting in a railway station.","answer":"The Sound of Silence","options":["The Sound of Silence","Piano Man","The Boxer","People Are Strange"],"artist":"Simon & Garfunkel","difficulty":"easy"},{"id":10,"clue":"A woman dreams of a different life while driving away from poverty.","answer":"Fast Car","options":["Fast Car","Drive","Take It Easy","Little Red Corvette"],"artist":"Tracy Chapman","difficulty":"easy"},{"id":11,"clue":"A singer insists they will survive after a breakup.","answer":"I Will Survive","options":["I Will Survive","Respect","Strong Enough","Dancing Queen"],"artist":"Gloria Gaynor","difficulty":"easy"},{"id":12,"clue":"A musician plays piano in a bar filled with people escaping their troubles.","answer":"Piano Man","options":["Piano Man","Tiny Dancer","Scenes from an Italian Restaurant","New York State of Mind"],"artist":"Billy Joel","difficulty":"easy"},{"id":13,"clue":"A couple finds hope and freedom in escaping their hometown together.","answer":"Born to Run","options":["Born to Run","Summer of '69","Thunder Road","Go Your Own Way"],"artist":"Bruce Springsteen","difficulty":"easy"},{"id":14,"clue":"A singer warns that money cannot buy genuine affection.","answer":"Can't Buy Me Love","options":["Can't Buy Me Love","Money","Material Girl","Rich Girl"],"artist":"The Beatles","difficulty":"easy"},{"id":15,"clue":"A person promises to stand by a friend during difficult times.","answer":"Lean on Me","options":["Lean on Me","Stand by Me","You've Got a Friend","Bridge over Troubled Water"],"artist":"Bill Withers","difficulty":"easy"},{"id":16,"clue":"A young woman dances alone and enjoys a night out.","answer":"Dancing Queen","options":["Dancing Queen","Girls Just Want to Have Fun","Footloose","Holiday"],"artist":"ABBA","difficulty":"easy"},{"id":17,"clue":"A singer says a former partner keeps calling after their relationship ends.","answer":"Hello","options":["Hello","Call Me","Don't You Want Me","Telephone"],"artist":"Adele","difficulty":"medium"},{"id":18,"clue":"A couple remembers dancing together at a young age.","answer":"Summer of '69","options":["Summer of '69","Dancing in the Dark","Jack & Diane","Brown Eyed Girl"],"artist":"Bryan Adams","difficulty":"medium"},{"id":19,"clue":"A singer wonders whether a person they love still feels the same.","answer":"Do You Love Me","options":["Do You Love Me","Love Me Do","Is This Love","How Deep Is Your Love"],"artist":"The Contours","difficulty":"medium"},{"id":20,"clue":"A person asks another to remain close through the night.","answer":"Stand by Me","options":["Stand by Me","Stay","Hold Me Now","Don't Leave Me This Way"],"artist":"Ben E. King","difficulty":"medium"}];
let deck=[],index=0,score=0,answered=false;
const el=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){deck=shuffle(questions.filter(q=>q.difficulty==="easy")).slice(0,8).concat(shuffle(questions.filter(q=>q.difficulty==="medium")).slice(0,2));deck=shuffle(deck);index=0;score=0;el("intro").classList.add("hidden");el("finish").classList.add("hidden");el("game").classList.remove("hidden");render()}
function render(){answered=false;const q=deck[index];el("round").textContent="ROUND "+(index+1)+" / "+deck.length;el("counter").textContent="SONG "+(index+1)+" OF "+deck.length;el("bar").style.width=((index)/deck.length*100)+"%";el("clue").textContent=q.clue;el("feedback").textContent="";el("next").classList.add("hidden");const a=el("answers");a.replaceChildren();shuffle(q.options).forEach(opt=>{const b=document.createElement("button");b.textContent=opt;b.addEventListener("click",()=>choose(opt));a.append(b)})}
function choose(opt){if(answered)return;answered=true;const q=deck[index];const correct=opt===q.answer;if(correct)score++;for(const b of el("answers").children){b.disabled=true;if(b.textContent===q.answer)b.classList.add("correct");else if(b.textContent===opt)b.classList.add("wrong")}el("feedback").textContent=(correct?"✓ That's right! ":"Not quite. ")+q.answer+" — "+q.artist;el("next").classList.remove("hidden");el("next").textContent=index===deck.length-1?"SEE MY SCORE →":"NEXT SONG →"}
function next(){if(++index<deck.length)render();else{el("game").classList.add("hidden");el("finish").classList.remove("hidden");el("round").textContent="FINISHED";el("finalScore").textContent=score+" / "+deck.length;el("finalMessage").textContent=score>=8?"Great round! You know your music.":score>=5?"Nice work! Try another round.":"Every round is a chance to discover more music."}}
el("start").addEventListener("click",start);el("again").addEventListener("click",start);el("next").addEventListener("click",next);
</script></body></html>
